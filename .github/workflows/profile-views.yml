name: Generate Profile Views Badge

on:
  schedule:
    # 每天 UTC 03:00 刷新一次（komarev 每被请求一次就会 +1，所以不要调得太频繁）
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-views.yml"
      - ".github/scripts/profile_views.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render badge SVG
        run: python3 .github/scripts/profile_views.py

      - name: Push to views branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          # 单独一个分支，避免和贪吃蛇的 output 分支互相覆盖
          target_branch: views
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
